<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Meta Pixel Code: अपना Pixel ID यहाँ लगाएँ -->

  <title>Daily Updates & Community</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #111827, #1f2937);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      color: #222;
      border-radius: 22px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .profile {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #229ED9;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .box {
      background: #f3f4f6;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .telegram-btn {
      display: block;
      background: #229ED9;
      color: white;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      transition: 0.2s;
    }

    .telegram-btn:hover {
      transform: scale(1.02);
      background: #168ac0;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- अपनी photo का नाम यहाँ डालें -->
    <img src="profile.jpg" class="profile" alt="Profile">

    <h1>Daily Updates & Community</h1>

    <p class="subtitle">
      Daily updates, information और community से जुड़े रहने के लिए
      हमारे Telegram channel से जुड़ें।
    </p>

    <div class="box">
      📢 Regular Updates<br>
      💬 Community Discussions<br>
      🔔 Important Notifications
    </div>

    <!-- अपना Telegram Link यहाँ डालें -->
    <a href="https://t.me/YourTelegramLink"
       class="telegram-btn"
       target="_blank">
      ✈️ Join Telegram Channel
    </a>

    <div class="footer">
      © 2026 Daily Updates & Community
    </div>

  </div>

</body>
</html>
